<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="400" viewBox="0 0 1180 400" role="img" aria-labelledby="title">
  <title id="title">标题重复治理流程</title>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#334155"/></marker><style>.box{fill:#f8fafc;stroke:#334155;stroke-width:1.4;rx:10}.store{fill:#ecfeff;stroke:#0e7490;stroke-width:1.4;rx:10}.decision{fill:#fefce8;stroke:#a16207;stroke-width:1.4}.text{font:15px "Microsoft YaHei",Arial,sans-serif;fill:#0f172a}.title{font:700 22px "Microsoft YaHei",Arial,sans-serif;fill:#0f172a}.small{font:13px "Microsoft YaHei",Arial,sans-serif;fill:#475569}.note{font:13px "Microsoft YaHei",Arial,sans-serif;fill:#334155}.line{stroke:#334155;stroke-width:1.5;fill:none;marker-end:url(#arrow)}.warn{fill:#fee2e2;stroke:#dc2626;stroke-width:1.2;rx:6}</style></defs>
  <rect width="1180" height="400" fill="#fff"/><text x="40" y="45" class="title">流程三：标题重复治理</text>
  <rect x="55" y="75" width="340" height="44" class="warn"/><text x="225" y="102" text-anchor="middle" class="small" fill="#dc2626">SHA256 精确重复已在 ingest 阶段硬拦截归档，不进入此流程</text>
  <rect x="55" y="145" width="130" height="64" class="box"/><text x="120" y="171" text-anchor="middle" class="text">候选来源</text><text x="120" y="192" text-anchor="middle" class="small">ingest / scan_title_duplicates</text>
  <rect x="245" y="145" width="160" height="64" class="store"/><text x="325" y="171" text-anchor="middle" class="text">重复候选表</text><text x="325" y="192" text-anchor="middle" class="small">duplicate_groups / candidates</text>
  <rect x="465" y="145" width="150" height="64" class="box"/><text x="540" y="171" text-anchor="middle" class="text">web /duplicates</text><text x="540" y="192" text-anchor="middle" class="small">人工决策</text>
  <polygon points="715,135 775,177 715,219 655,177" class="decision"/><text x="715" y="182" text-anchor="middle" class="text">决策</text>
  <rect x="835" y="75" width="140" height="58" class="store"/><text x="905" y="99" text-anchor="middle" class="text">_archive</text><text x="905" y="119" text-anchor="middle" class="small">same_work</text>
  <rect x="835" y="150" width="140" height="58" class="store"/><text x="905" y="174" text-anchor="middle" class="text">work_relations</text><text x="905" y="194" text-anchor="middle" class="small">关系类型</text>
  <rect x="835" y="225" width="140" height="58" class="store"/><text x="905" y="249" text-anchor="middle" class="text">标记已审</text><text x="905" y="269" text-anchor="middle" class="small">not_duplicate</text>
  <rect x="1015" y="150" width="125" height="58" class="store"/><text x="1078" y="174" text-anchor="middle" class="text">_quarantine</text><text x="1078" y="194" text-anchor="middle" class="small">坏源隔离</text>
  <line x1="185" y1="177" x2="245" y2="177" class="line"/><line x1="405" y1="177" x2="465" y2="177" class="line"/><line x1="615" y1="177" x2="655" y2="177" class="line"/><line x1="760" y1="160" x2="835" y2="104" class="line"/><line x1="775" y1="177" x2="835" y2="177" class="line"/><line x1="760" y1="196" x2="835" y2="254" class="line"/><line x1="775" y1="186" x2="1015" y2="178" class="line"/>
  <rect x="55" y="340" width="1085" height="44" fill="#f1f5f9" stroke="#cbd5e1" rx="8"/><text x="75" y="367" class="note">代码核对：ingest 内 SHA256 精确重复直接归档（硬拦截）；此流程处理 Jaccard 标题相似候选，不阻塞入库，审核可在摄入后或元数据回填 title 后迭代重扫。</text>
</svg>
