  <rect x="820" y="80" width="140" height="58" class="store"/><text x="890" y="114" text-anchor="middle" class="text">_collector_cache</text>
  <rect x="820" y="170" width="140" height="58" class="box"/><text x="890" y="204" text-anchor="middle" class="text">gate</text>
  <rect x="820" y="260" width="140" height="58" class="store"/><text x="890" y="286" text-anchor="middle" class="text">candidate_store</text><text x="890" y="306" text-anchor="middle" class="small">SQLite</text>
  <rect x="435" y="300" width="145" height="58" class="box"/><text x="508" y="334" text-anchor="middle" class="text">ingest_bridge</text>
