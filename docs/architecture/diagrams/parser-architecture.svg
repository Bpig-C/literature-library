<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430" role="img" aria-labelledby="title">
  <title id="title">Parser 子项目架构</title>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#334155"/></marker><style>.box{fill:#f8fafc;stroke:#334155;stroke-width:1.4;rx:10}.store{fill:#ecfeff;stroke:#0e7490;stroke-width:1.4;rx:10}.external{fill:#fff7ed;stroke:#c2410c;stroke-width:1.4;rx:10}.text{font:15px "Microsoft YaHei",Arial,sans-serif;fill:#0f172a}.title{font:700 22px "Microsoft YaHei",Arial,sans-serif;fill:#0f172a}.small{font:13px "Microsoft YaHei",Arial,sans-serif;fill:#475569}.line{stroke:#334155;stroke-width:1.4;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect width="1100" height="430" fill="#fff"/><text x="40" y="45" class="title">Parser 子项目架构</text>
  <rect x="60" y="120" width="180" height="70" class="box"/><text x="150" y="150" text-anchor="middle" class="text">batch parse CLI</text><text x="150" y="172" text-anchor="middle" class="small">scripts/literature_batch_parse.py</text>
  <rect x="315" y="120" width="180" height="70" class="box"/><text x="405" y="150" text-anchor="middle" class="text">route_and_parse</text><text x="405" y="172" text-anchor="middle" class="small">parser/core/mineru/router.py</text>
  <rect x="570" y="60" width="170" height="62" class="box"/><text x="655" y="86" text-anchor="middle" class="text">PyMuPDF</text><text x="655" y="106" text-anchor="middle" class="small">文本层本地直抽</text>
  <rect x="570" y="150" width="170" height="62" class="external"/><text x="655" y="176" text-anchor="middle" class="text">MinerU cloud VLM</text><text x="655" y="196" text-anchor="middle" class="small">当前主云链路</text>
  <rect x="570" y="240" width="170" height="62" class="external"/><text x="655" y="266" text-anchor="middle" class="text">selfdeploy</text><text x="655" y="286" text-anchor="middle" class="small">降级兼容</text>
  <rect x="820" y="150" width="180" height="70" class="store"/><text x="910" y="178" text-anchor="middle" class="text">解析产物</text><text x="910" y="200" text-anchor="middle" class="small">content.md / content.json</text>
  <rect x="315" y="285" width="180" height="70" class="box"/><text x="405" y="314" text-anchor="middle" class="text">可选 HTTP 服务</text><text x="405" y="336" text-anchor="middle" class="small">parser/main.py</text>
  <rect x="570" y="325" width="170" height="62" class="box"/><text x="655" y="351" text-anchor="middle" class="text">Agent API</text><text x="655" y="371" text-anchor="middle" class="small">api/routes_agent.py</text>
  <line x1="240" y1="155" x2="315" y2="155" class="line"/><line x1="495" y1="150" x2="570" y2="91" class="line"/><line x1="495" y1="158" x2="570" y2="181" class="line"/><line x1="495" y1="166" x2="570" y2="271" class="line"/><line x1="740" y1="91" x2="820" y2="170" class="line"/><line x1="740" y1="181" x2="820" y2="185" class="line"/><line x1="740" y1="271" x2="820" y2="205" class="line"/><line x1="495" y1="320" x2="570" y2="356" class="line"/>
</svg>
