<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="360" viewBox="0 0 1180 360" role="img" aria-labelledby="title">
  <title id="title">去重、关系与隔离治理</title>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#334155"/></marker><style>.box{fill:#f8fafc;stroke:#334155;stroke-width:1.4;rx:10}.store{fill:#ecfeff;stroke:#0e7490;stroke-width:1.4;rx:10}.decision{fill:#fefce8;stroke:#a16207;stroke-width:1.4}.text{font:15px "Microsoft YaHei",Arial,sans-serif;fill:#0f172a}.title{font:700 22px "Microsoft YaHei",Arial,sans-serif;fill:#0f172a}.small{font:13px "Microsoft YaHei",Arial,sans-serif;fill:#475569}.line{stroke:#334155;stroke-width:1.5;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect width="1180" height="360" fill="#fff"/><text x="40" y="45" class="title">流程三：去重、关系与隔离治理</text>
  <rect x="55" y="125" width="130" height="64" class="box"/><text x="120" y="151" text-anchor="middle" class="text">候选来源</text><text x="120" y="172" text-anchor="middle" class="small">ingest / scan / collector</text>
  <rect x="245" y="125" width="160" height="64" class="store"/><text x="325" y="151" text-anchor="middle" class="text">重复候选表</text><text x="325" y="172" text-anchor="middle" class="small">groups / candidates</text>
  <rect x="465" y="125" width="150" height="64" class="box"/><text x="540" y="151" text-anchor="middle" class="text">web /duplicates</text><text x="540" y="172" text-anchor="middle" class="small">人工决策</text>
  <polygon points="715,115 775,157 715,199 655,157" class="decision"/><text x="715" y="162" text-anchor="middle" class="text">决策</text>
  <rect x="835" y="55" width="140" height="58" class="store"/><text x="905" y="79" text-anchor="middle" class="text">_archive</text><text x="905" y="99" text-anchor="middle" class="small">same_work</text>
  <rect x="835" y="130" width="140" height="58" class="store"/><text x="905" y="154" text-anchor="middle" class="text">work_relations</text><text x="905" y="174" text-anchor="middle" class="small">关系类型</text>
  <rect x="835" y="205" width="140" height="58" class="store"/><text x="905" y="229" text-anchor="middle" class="text">标记已审</text><text x="905" y="249" text-anchor="middle" class="small">not_duplicate</text>
  <rect x="1015" y="130" width="125" height="58" class="store"/><text x="1078" y="154" text-anchor="middle" class="text">_quarantine</text><text x="1078" y="174" text-anchor="middle" class="small">坏源隔离</text>
  <line x1="185" y1="157" x2="245" y2="157" class="line"/><line x1="405" y1="157" x2="465" y2="157" class="line"/><line x1="615" y1="157" x2="655" y2="157" class="line"/><line x1="760" y1="140" x2="835" y2="84" class="line"/><line x1="775" y1="157" x2="835" y2="157" class="line"/><line x1="760" y1="176" x2="835" y2="234" class="line"/><line x1="775" y1="166" x2="1015" y2="158" class="line"/>
  <text x="55" y="310" class="small">当前 active 去重输入：强键、SHA256、标题 Jaccard；可在摄入后先审，也可在元数据回填 title 后重扫。</text>
</svg>
