<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="760" viewBox="0 0 1420 760" role="img" aria-labelledby="title desc">
  <title id="title">业务流程总览</title>
  <desc id="desc">展示手动 inbox、collector、ingest、去重审核、parser、元数据抽取审核、分类抽取审核之间的主流程关系。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#334155"/>
    </marker>
    <style>
      .box{fill:#f8fafc;stroke:#334155;stroke-width:1.4;rx:10}
      .stage{fill:#eef2ff;stroke:#4338ca;stroke-width:1.6;rx:10}
      .store{fill:#ecfeff;stroke:#0e7490;stroke-width:1.4;rx:10}
      .review{fill:#fefce8;stroke:#a16207;stroke-width:1.4;rx:10}
      .module{fill:#fff7ed;stroke:#c2410c;stroke-width:1.4;rx:10}
      .title{font:700 26px "Microsoft YaHei",Arial,sans-serif;fill:#0f172a}
      .text{font:15px "Microsoft YaHei",Arial,sans-serif;fill:#0f172a}
      .small{font:13px "Microsoft YaHei",Arial,sans-serif;fill:#475569}
      .note{font:13px "Microsoft YaHei",Arial,sans-serif;fill:#334155}
      .line{stroke:#334155;stroke-width:1.6;fill:none;marker-end:url(#arrow)}
      .soft{stroke:#64748b;stroke-width:1.4;stroke-dasharray:7 5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1420" height="760" fill="#ffffff"/>
  <text x="40" y="52" class="title">业务主流水线总览</text>
  <text x="40" y="78" class="small">按代码事实绘制：ingest 内 SHA256 精确重复是硬拦截；标题重复候选不阻塞入库，审核可迭代进行；解析成功后才能进入元数据/分类抽取。</text>

  <rect x="55" y="145" width="160" height="74" class="box"/>
  <text x="135" y="176" text-anchor="middle" class="text">手动 PDF</text>
  <text x="135" y="199" text-anchor="middle" class="small">_inbox dry-run/execute</text>

  <rect x="55" y="295" width="160" height="94" class="module"/>
  <text x="135" y="326" text-anchor="middle" class="text">collector 子项目</text>
  <text x="135" y="349" text-anchor="middle" class="small">collect / resolve</text>
  <text x="135" y="370" text-anchor="middle" class="small">候选审核后 promote</text>

  <rect x="275" y="280" width="160" height="80" class="review"/>
  <text x="355" y="312" text-anchor="middle" class="text">候选审核</text>
  <text x="355" y="335" text-anchor="middle" class="small">intake_candidates</text>

  <rect x="275" y="130" width="190" height="100" class="stage"/>
  <text x="370" y="158" text-anchor="middle" class="text">ingest 核心链路</text>
  <text x="370" y="178" text-anchor="middle" class="small">literature_ingest.py</text>
  <rect x="285" y="188" width="170" height="34" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2" rx="6"/>
  <text x="370" y="210" text-anchor="middle" class="small" fill="#dc2626">SHA256 精确重复 → 硬拦截归档</text>

  <rect x="530" y="120" width="220" height="124" class="store"/>
  <text x="640" y="154" text-anchor="middle" class="text">技术入库点</text>
  <text x="640" y="178" text-anchor="middle" class="small">works</text>
  <text x="640" y="199" text-anchor="middle" class="small">source_files</text>
  <text x="640" y="220" text-anchor="middle" class="small">literature_parse_runs(pending)</text>

  <rect x="815" y="120" width="185" height="124" class="review"/>
  <text x="908" y="154" text-anchor="middle" class="text">标题重复治理</text>
  <text x="908" y="178" text-anchor="middle" class="small">duplicate_groups</text>
  <text x="908" y="199" text-anchor="middle" class="small">duplicate_candidates</text>
  <text x="908" y="220" text-anchor="middle" class="small">可迭代：摄入后 / 回填后</text>

  <rect x="1060" y="120" width="175" height="124" class="module"/>
  <text x="1148" y="154" text-anchor="middle" class="text">parser 子项目</text>
  <text x="1148" y="178" text-anchor="middle" class="small">parse trigger</text>
  <text x="1148" y="199" text-anchor="middle" class="small">PyMuPDF / MinerU VLM</text>
  <text x="1148" y="220" text-anchor="middle" class="small">content.md</text>

  <rect x="80" y="505" width="185" height="92" class="stage"/>
  <text x="172" y="538" text-anchor="middle" class="text">元数据抽取</text>
  <text x="172" y="562" text-anchor="middle" class="small">metadata_extractions</text>
  <text x="172" y="582" text-anchor="middle" class="small">门禁：content_md_path</text>

  <rect x="330" y="505" width="185" height="92" class="review"/>
  <text x="422" y="538" text-anchor="middle" class="text">元数据审核</text>
  <text x="422" y="562" text-anchor="middle" class="small">approved / needs_fix</text>
  <text x="422" y="582" text-anchor="middle" class="small">回填 works</text>

  <rect x="595" y="505" width="185" height="92" class="stage"/>
  <text x="688" y="538" text-anchor="middle" class="text">分类抽取</text>
  <text x="688" y="562" text-anchor="middle" class="small">classification_extractions</text>
  <text x="688" y="582" text-anchor="middle" class="small">可含 collector 建议标签</text>

  <rect x="845" y="505" width="185" height="92" class="review"/>
  <text x="938" y="538" text-anchor="middle" class="text">分类审核</text>
  <text x="938" y="562" text-anchor="middle" class="small">回填 works</text>
  <text x="938" y="582" text-anchor="middle" class="small">写 work_classification_tags</text>

  <rect x="1105" y="505" width="200" height="92" class="store"/>
  <text x="1205" y="538" text-anchor="middle" class="text">增强后的文献库</text>
  <text x="1205" y="562" text-anchor="middle" class="small">基础元数据 + 分类标签</text>
  <text x="1205" y="582" text-anchor="middle" class="small">仍可继续分析/阅读</text>

  <line x1="215" y1="182" x2="275" y2="182" class="line"/>
  <line x1="215" y1="342" x2="275" y2="326" class="line"/>
  <line x1="435" y1="320" x2="530" y2="205" class="line"/>
  <line x1="465" y1="182" x2="530" y2="182" class="line"/>
  <line x1="750" y1="182" x2="815" y2="182" class="soft"/>
  <line x1="1000" y1="182" x2="1060" y2="182" class="soft"/>
  <path d="M750 210 C850 300, 1030 300, 1060 210" class="line"/>
  <path d="M1148 244 C1148 365, 172 365, 172 505" class="line"/>
  <line x1="265" y1="551" x2="330" y2="551" class="line"/>
  <line x1="515" y1="551" x2="595" y2="551" class="line"/>
  <line x1="780" y1="551" x2="845" y2="551" class="line"/>
  <line x1="1030" y1="551" x2="1105" y2="551" class="line"/>

  <path d="M422 505 C422 425, 908 425, 908 244" class="soft"/>
  <text x="650" y="416" class="note">元数据回填 title 后，可重跑标题 Jaccard 扫描并补做去重审核。</text>
  <text x="790" y="296" class="note">解析不依赖“去重已审核”；直接消费 parse_runs(pending)。</text>

  <rect x="55" y="655" width="1270" height="58" fill="#f1f5f9" stroke="#cbd5e1" rx="8"/>
  <text x="75" y="680" class="note">代码核对：ingest 内 SHA256 精确重复直接归档到 _duplicates/exact_sha256（硬拦截）；标题 Jaccard 候选写入 duplicate_groups/candidates（不阻塞入库）；去重审核可在摄入后或元数据回填后迭代。</text>
</svg>
